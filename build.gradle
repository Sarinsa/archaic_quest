buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}
plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'idea'
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "archaic_quest.mixins.refmap.json"
}

version = "${mod_version}-${mc_version}"
group = 'com.obsidian_core.archaic_quest'
archivesBaseName = 'archaic_quest'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: 'official', version: "${mc_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                archaic_quest {
                    source sourceSets.main
                }
            }
        }

        client {
            property "mixin.debug.export", "true"
            arg "-mixin.config=archaic_quest.mixins.json"
        }
        server {
            property "mixin.debug.export", "true"
            arg "-mixin.config=archaic_quest.mixins.json"
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'archaic_quest'
        }
        data {
            args '--mod', 'archaic_quest', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven {
        name 'CurseMaven'
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Minecraft Forge"
        url = "https://maven.minecraftforge.net"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // JEI
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Jade
    runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_version}")

    // Terrablender
    implementation fg.deobf("curse.maven:terrablender-563928:${tb_version}")

    // Ryomic Lights - NOTE: comment out this when testing dedicated server or crash
    implementation fg.deobf("curse.maven:ryoamiclights-913587:${ryoamic_version}")
    compileOnly "curse.maven:ryoamiclights_src-913587:${ryoamic_src_version}"
    implementation fg.deobf("curse.maven:obsidianui-684718:${obsidianui_version}")

    // WorldEdit
    runtimeOnly fg.deobf("curse.maven:worldedit-225608:${we_version}")

    // Mekanism
    runtimeOnly fg.deobf("curse.maven:mekanism-268560:${mekanism_version}")

    // Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Archaic Quest",
                "Specification-Vendor"    : "Archaic Quest Team",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Archaic Quest Team",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "archaic_quest.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}